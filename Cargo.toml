[package]
name = "singularix-rspi"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
futures = "0.3.31"
tokio = { version = "1.49.0", features = ["full"] }
actix-web = "4.12.1"
actix-web-lab = "0.24.3"
async-stream = "0.3.6"
serde = "1.0.228"
serde_json = "1.0.149"
actix-cors = "0.7.1"
dotenvy = "0.15"
chrono = { version = "0.4.42", features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
spidev = "0.6"