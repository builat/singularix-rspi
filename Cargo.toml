[package]
name = "singularix-rspi"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
tokio = { version = "1.53.3", features = ["full"] }
actix-web = "4.12.1"
actix-web-lab = "0.29.5"
async-stream = "0.3.6"
serde = "1.0.229"
serde_json = "1.0.154"
actix-cors = "0.7.2"
dotenvy = "0.15"
chrono = { version = "0.4.45", features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
spidev = "0.7.1"